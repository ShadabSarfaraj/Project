<!doctype html>
<html lang="en">
  <head>
    <title>Color Changer Project</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Color Changer</h1>
    <span class="selector lightPink" data-color="lightPink"></span
    ><span data-color="yellow" class="selector yellow"></span
    ><span data-color="lightBlue" class="selector lightBlue"></span
    ><span data-color="black" class="selector black"></span
    ><span data-color="white" class="selector white"></span>
    <script src="script.js"></script>
  </body>
</html>
