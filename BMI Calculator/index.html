<!doctype html>
<html lang="en">
  <head>
    <title>BMI Calculator</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>BMI Calculator</h1>
    <span>Height in CM: </span><label for="height"></label
    ><input type="text" id="height" /><br />
    <span>Weight in KG: </span><label for="weight"></label
    ><input type="text" id="weight" /><br />
    <button onclick="calculateBMI()">Calculate</button><br />
    <span id="result"></span><br />
    <h2>BMI Weight Guide</h2>
    <span>Under Weight = Less than 18.6</span><br />
    <span>Normal Range = 18.6 and 24.9</span><br />
    <span>Overweight = Greater than 24.9</span><br />
    <script src="script.js"></script>
  </body>
</html>
